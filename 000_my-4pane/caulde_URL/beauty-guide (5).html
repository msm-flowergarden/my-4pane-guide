<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>私の美容習慣ガイド</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #c9796a;
    --rose-light: #f2e0db;
    --rose-pale: #fdf5f3;
    --gold: #b89a6a;
    --gold-light: #f5eed8;
    --navy: #2d3748;
    --text: #3d3530;
    --text-light: #7a6e69;
    --white: #ffffff;
    --border: #e8d8d0;
    --active-bg: #c9796a;
    --pane2-bg: #fdf8f0;
    --pane3-bg: #f8fdf5;
    --pane4-bg: #f5f0fd;
    --shadow: 0 2px 12px rgba(180,120,100,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: linear-gradient(135deg, #fdf5f3 0%, #f5eed8 50%, #fdf5f3 100%);
    min-height: 100vh;
    color: var(--text);
  }

  /* ヘッダー */
  .header {
    background: linear-gradient(90deg, #c9796a, #b89a6a);
    color: white;
    text-align: center;
    padding: 18px 20px 14px;
    box-shadow: 0 2px 10px rgba(180,100,80,0.25);
  }
  .header h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  .header p {
    font-size: 0.75rem;
    opacity: 0.85;
    margin-top: 3px;
    letter-spacing: 0.08em;
  }

  /* メインレイアウト */
  .main {
    display: flex;
    height: calc(100vh - 70px);
    gap: 0;
  }

  /* ===== ペイン1: 美容項目メニュー ===== */
  .pane1 {
    width: 148px;
    min-width: 148px;
    background: white;
    border-right: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    box-shadow: 2px 0 8px rgba(180,120,100,0.08);
    overflow-y: auto;
  }
  .pane1-label {
    background: var(--rose-light);
    color: var(--rose);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-align: center;
    padding: 8px 4px;
    border-bottom: 1px solid var(--border);
  }
  .menu-item {
    padding: 14px 10px 14px 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--text);
    transition: all 0.2s;
    line-height: 1.4;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .menu-item:hover {
    background: var(--rose-pale);
    color: var(--rose);
    padding-left: 18px;
  }
  .menu-item.active {
    background: var(--active-bg);
    color: white;
    font-weight: 700;
    padding-left: 18px;
    box-shadow: inset 3px 0 0 rgba(255,255,255,0.5);
  }
  .menu-item .icon { font-size: 1rem; }

  /* ===== ペイン2〜4 共通 ===== */
  .pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--border);
  }
  .pane:last-child { border-right: none; }

  .pane-header {
    padding: 10px 14px 8px;
    font-family: 'Noto Serif JP', serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    border-bottom: 2px solid;
    flex-shrink: 0;
  }
  .pane2 .pane-header {
    background: var(--gold-light);
    color: var(--gold);
    border-color: var(--gold);
  }
  .pane3 .pane-header {
    background: #e8f5e0;
    color: #5a8a3a;
    border-color: #8aba60;
    border-bottom-width: 2px;
  }
  .pane4 .pane-header {
    background: #ede8f5;
    color: #7a5aaa;
    border-color: #a080cc;
  }

  .pane-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 14px 20px;
    font-size: 0.88rem;
    line-height: 1.8;
  }
  .pane2 { background: var(--pane2-bg); }
  .pane3 { background: var(--pane3-bg); }
  .pane4 { background: var(--pane4-bg); }

  /* コンテンツスタイル */
  .section-title {
    font-family: 'Noto Serif JP', serif;
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--rose);
    margin: 14px 0 6px;
    padding-left: 8px;
    border-left: 3px solid var(--rose);
  }
  .section-title:first-child { margin-top: 0; }

  .urgent-box {
    background: linear-gradient(135deg, #fff0ee, #ffe8e0);
    border: 2px solid var(--rose);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
    font-size: 0.85rem;
  }
  .urgent-label {
    font-weight: 700;
    color: var(--rose);
    font-size: 0.82rem;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .urgent-box p { color: var(--text); line-height: 1.7; }

  .content-block {
    background: white;
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
    font-size: 0.85rem;
    line-height: 1.8;
    color: var(--text);
  }
  .content-block strong {
    color: var(--navy);
    font-weight: 700;
  }

  .tag {
    display: inline-block;
    background: var(--rose-light);
    color: var(--rose);
    font-size: 0.68rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    margin-bottom: 6px;
  }
  .tag-green {
    background: #e0f0d8;
    color: #4a7a2a;
  }
  .tag-purple {
    background: #ede0f8;
    color: #7a4aaa;
  }
  .tag-gold {
    background: var(--gold-light);
    color: var(--gold);
  }

  .cheer-box {
    background: linear-gradient(135deg, #f5f0fd, #ede0f8);
    border: 1px solid #c0a0e0;
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 10px;
    font-size: 0.84rem;
    line-height: 1.85;
    color: #4a3060;
    font-style: italic;
  }

  .bullet { padding-left: 14px; }
  .bullet li {
    list-style: none;
    padding: 3px 0;
    position: relative;
  }
  .bullet li::before {
    content: '◆';
    color: var(--rose);
    font-size: 0.5rem;
    position: absolute;
    left: -12px;
    top: 5px;
  }

  .warning-text {
    color: #c05020;
    font-weight: 700;
    font-size: 0.74rem;
    background: #fff5ee;
    border: 1px solid #f0c0a0;
    border-radius: 5px;
    padding: 6px 10px;
    margin: 6px 0;
  }

  /* 初期画面 */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-light);
    text-align: center;
    padding: 30px;
  }
  .welcome .arrow { font-size: 2.5rem; margin-bottom: 12px; }
  .welcome p { font-size: 0.85rem; line-height: 1.8; }

  /* スクロールバー */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>

        心を整えることが、<strong>一番効くアンチエイジング</strong>です。
      </div>
      <div class="section-title">【続けるコツ】</div>
      <div class="content-block">
        <ul class="bullet">
          <li>「気づけた時点で勝ち」。完璧にやめなくていい</li>
          <li>夫への一言は「報告」ではなく「ガス抜き」として使う</li>
          <li>充電法は「やるべきこと」ではなく「自分へのご褒美」として</li>
        </ul>
      </div>
      <div class="cheer-box">
        💜 <strong>応援メッセージ</strong><br><br>
        「今日もがんばれる」と毎朝自分に言い聞かせているあなたは、誰よりも強い人です。仕事も、家事も、1型糖尿病の管理も、更年期の変化も——全部を一人で抱えながら毎日を動いている。「どうしようどうしよう」となる時があって当然です。お風呂の湯船、大好きな音楽、散歩の太陽——あなたにはすでに心を守る「道具」が揃っています。今日も少しだけ、自分を甘やかしてあげてください。それがいちばんのアンチエイジングです。
      </div>
    `
  }
};

function show(key) {
  // メニューのアクティブ状態を更新
  document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
  document.getElementById('menu-' + key).classList.add('active');

  // コンテンツを更新
  document.getElementById('pane2').innerHTML = data[key].p2;
  document.getElementById('pane3').innerHTML = data[key].p3;
  document.getElementById('pane4').innerHTML = data[key].p4;

  // スクロールをトップに戻す
  ['pane2','pane3','pane4'].forEach(id => {
    document.getElementById(id).scrollTop = 0;
  });
}
</script>
